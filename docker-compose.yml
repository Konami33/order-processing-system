version: '3.8'

services:
  nginx:
    image: nginx:1.26.0
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      order-api:
        condition: service_healthy
    networks:
      - order-network

  order-api:
    build:
      context: ./order-api
      dockerfile: Dockerfile
    environment:
      - MONGO_URI=mongodb://mongodb:27017/orders_db?replicaSet=rs0
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - NODE_ENV=development
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ./order-api/logs:/app/logs
    networks:
      - order-network

  order-processor:
    build:
      context: ./order-processor
      dockerfile: Dockerfile
    environment:
      - MONGO_URI=mongodb://mongodb:27017/orders_db?replicaSet=rs0
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - NODE_ENV=development
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    volumes:
      - ./order-processor/logs:/app/logs
    networks:
      - order-network

  mongodb:
    image: mongo:7.0.12
    environment:
      - MONGO_INITDB_DATABASE=orders_db
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    ports:
      - "27017:27017"
    command: mongod --replSet rs0
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - order-network

  rabbitmq:
    image: rabbitmq:3.13.7-management
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - order-network

volumes:
  mongodb_data:

networks:
  order-network:
    driver: bridge